[package]
name = "im"
version = "0.1.0"
authors = ["thscharler <thscharler@gmail.com>"]
keywords = ["images"]
edition = "2024"
license = "MIT/Apache-2.0"
# repository =

[dependencies]
anyhow = "1.0"
log = "0.4"
fern = "0.7"
dirs = "6.0"

image = "0.25"
winit = { version = "0.30" }
ratatui = "0.30.0"
crossterm = { version = "0.29.0" }

rat-salsa-wgpu = { version = "1.0", path = "../rat-salsa-wgpu", features = ["dialog_widgets", "fallback_font", "fallback_symbol_font", "fallback_emoji_font"] }
#rat-salsa-wgpu = { version = "1.0", git = "https://github.com/thscharler/rat-salsa-wgpu", features = ["dialog_widgets", "fallback_font", "fallback_symbol_font", "fallback_emoji_font"]}
rat-widget = { version = "3.0", path = "../rat-salsa/rat-widget", features = ["user_directories", "cli-clipboard"] }
rat-theme4 = { version = "4.5", path = "../rat-salsa/rat-theme4" }

